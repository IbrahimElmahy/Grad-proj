<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RVMS Mobile Preview</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1020;
        --panel: #121a2f;
        --metal: #2a2f3b;
        --screen: #f5f7fb;
        --accent: #46d38b;
        --text: #eef3ff;
        --muted: #9aa7bd;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at 18% 12%, rgba(70, 211, 139, 0.16), transparent 28%),
          linear-gradient(135deg, #090d18 0%, #10182a 48%, #151515 100%);
        color: var(--text);
      }

      .stage {
        min-height: 100vh;
        display: grid;
        grid-template-columns: minmax(280px, 0.72fr) minmax(360px, 430px) minmax(220px, 0.6fr);
        align-items: center;
        gap: clamp(24px, 4vw, 64px);
        padding: clamp(24px, 4vw, 56px);
      }

      .brand {
        align-self: center;
      }

      .eyebrow {
        margin: 0 0 14px;
        color: var(--accent);
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        max-width: 520px;
        font-size: clamp(42px, 6vw, 88px);
        line-height: 0.94;
        letter-spacing: 0;
      }

      .subtitle {
        margin: 24px 0 0;
        max-width: 440px;
        color: var(--muted);
        font-size: clamp(16px, 1.4vw, 20px);
        line-height: 1.55;
      }

      .phone-wrap {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .phone {
        position: relative;
        width: min(390px, 82vw);
        aspect-ratio: 390 / 844;
        padding: 14px;
        border-radius: 58px;
        background:
          linear-gradient(145deg, #f4f7fb 0%, #767b86 8%, #252a35 24%, #0b0f18 72%, #555b66 100%);
        box-shadow:
          0 34px 86px rgba(0, 0, 0, 0.58),
          inset 0 0 0 2px rgba(255, 255, 255, 0.18),
          inset 0 0 0 7px rgba(0, 0, 0, 0.82);
      }

      .phone::before {
        content: "";
        position: absolute;
        left: 50%;
        top: 18px;
        z-index: 4;
        width: 124px;
        height: 34px;
        transform: translateX(-50%);
        border-radius: 0 0 20px 20px;
        background: #05070b;
        box-shadow: inset 0 -1px 0 rgba(255, 255, 255, 0.07);
      }

      .phone::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: 22px;
        z-index: 4;
        width: 132px;
        height: 5px;
        transform: translateX(-50%);
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.44);
      }

      .screen {
        width: 100%;
        height: 100%;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 45px;
        background: var(--screen);
      }

      .screen iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: var(--screen);
      }

      .side {
        align-self: end;
        margin-bottom: 54px;
      }

      .status {
        display: grid;
        gap: 12px;
        max-width: 280px;
      }

      .status-row {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #dce6f7;
        font-size: 15px;
        font-weight: 700;
      }

      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 18px rgba(70, 211, 139, 0.9);
      }

      .hint {
        margin-top: 18px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }

      @media (max-width: 980px) {
        body {
          overflow: auto;
        }

        .stage {
          grid-template-columns: 1fr;
          justify-items: center;
          padding: 28px;
        }

        .brand,
        .side {
          text-align: center;
          margin: 0;
        }

        .subtitle,
        .status {
          margin-left: auto;
          margin-right: auto;
        }
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <section class="brand">
        <p class="eyebrow">Runway Visual Monitoring System</p>
        <h1>RVMS Mobile</h1>
        <p class="subtitle">
          Live inspection status, alerts, history, and safety operations shown in a clean mobile presentation frame.
        </p>
      </section>

      <section class="phone-wrap" aria-label="iPhone style mobile preview">
        <div class="phone">
          <div class="screen">
            <iframe src="http://127.0.0.1:5174/#/home" title="RVMS mobile app"></iframe>
          </div>
        </div>
      </section>

      <aside class="side">
        <div class="status">
          <div class="status-row"><span class="dot"></span><span>Backend connected</span></div>
          <div class="status-row"><span class="dot"></span><span>Mobile UI live</span></div>
          <div class="status-row"><span class="dot"></span><span>AI engine idle</span></div>
        </div>
        <p class="hint">
          Keep the Flutter web server running on port 5174 while presenting this frame.
        </p>
      </aside>
    </main>
  </body>
</html>
